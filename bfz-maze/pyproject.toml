[project]
name = "bfs-maze"
version = "1.0.0"
description = "BFS algorithm for finding the shortest path in a text-based maze"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.urls]
"Homepage" = "https://github.com/YOUR_USERNAME/bfs-maze"
"Source" = "https://github.com/YOUR_USERNAME/bfs-maze"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=app --cov-report xml:coverage.xml --cov-report term"
testpaths = [
    "tests",
]
pythonpath = "."

[project.scripts]
maze-solver = "app.main:main"

[tool.coverage.run]
omit = [
    "*/__init__.py",
    "alembic/*",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",    # All errors
    "F",    # PyFlakes
    "B",    # Bugbear
    "Q",    # Quoting
    "I",    # Isort
    "S",    # flake8-bandit
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "LOG",  # flake8-logging
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "C90",  # mcCabe complexity
]
ignore = ["E501"]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F403"]
"**/{tests,docs,tools}/*" = ["E402", "S101"]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]
